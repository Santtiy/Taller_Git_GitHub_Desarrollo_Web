<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Referencia - Focas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        
        .header {
            background-color: #3a3a3a;
            color: white;
            padding: 20px 30px;
            margin-bottom: 30px;
            font-size: 24px;
            font-weight: bold;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .credit {
            padding: 15px 30px;
            background-color: #f9f9f9;
            color: #666;
            font-size: 12px;
            text-decoration: none;
            display: inline-block;
            letter-spacing: 1px;
        }
        
        .credit a {
            color: #0066cc;
            text-decoration: none;
        }
        
        .content {
            display: flex;
            padding: 40px;
            gap: 40px;
        }
        
        .info {
            flex: 1;
        }
        
        .info-row {
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .label {
            font-weight: bold;
            display: inline;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        
        .value {
            display: inline;
            margin-left: 5px;
            font-size: 16px;
        }
        
        .image {
            flex: 0 0 auto;
        }
        
        .image img {
            max-width: 250px;
            height: auto;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        Requerimiento 1: Creación de la Página HTML 
    </div>
    
    <div class="container">
        <div class="credit">
            FOTOGRAFÍA DE FOCA, IMAGEN DE REFERENCIA
        </div>
        
        <div class="content">
            <div class="info">
                <div class="info-row">
                    <span class="label">NOMBRE COMÚN:</span>
                    <span class="value">Foca</span>
                </div>
                
                <div class="info-row">
                    <span class="label">NOMBRE CIENTÍFICO:</span>
                    <span class="value"><em>Phoca vitulina</em></span>
                </div>
                
                <div class="info-row">
                    <span class="label">CLASE:</span>
                    <span class="value">Mamifero</span>
                </div>
                
                <div class="info-row">
                    <span class="label">VIDA MEDIA EN LIBERTAD:</span>
                    <span class="value">25-30 años</span>
                </div>
                
                <div class="info-row">
                    <span class="label">TAMAÑO:</span>
                    <span class="value">De 1,5 a 2 metros</span>
                </div>
                
                <div class="info-row">
                    <span class="label">PESO:</span>
                    <span class="value">De 50 a 150 kilos</span>
                </div>
            </div>
            
            <div class="image">
                <img src="foca.jpeg" alt="Foca">
            </div>
        </div>
    </div>
</body>
</html>
